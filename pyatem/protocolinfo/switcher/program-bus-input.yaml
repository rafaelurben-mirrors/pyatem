name: program-bus-input
code: PrgI
description: |
  Data from the `PrgI` field. This represents the active channel on the program bus of the specific M/E unit.

  The mixer will send a field for every M/E unit in the mixer.
type: field
fields:
  - offset: 0
    size: 1
    type: u8
    name: index
    description: M/E Index
    default: 0
    repr: full
    unique: true
  - offset: 1
    size: 1
    type: "?"
    description: padding
  - offset: 2
    size: 2
    type: u16
    name: source
    description: Source index
    repr: full
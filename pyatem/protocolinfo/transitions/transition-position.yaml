name: transition-position
code: TrPs
description: |
  Data from the `TrPs` field. This represents the state of the transition T-handle position

  The mixer will send a field for every M/E unit in the mixer.
type: field
fields:
  - offset: 0
    size: 1
    type: u8
    name: index
    description: M/E Index
    default: 0
    repr: full
    unique: true
  - offset: 1
    size: 1
    type: bool
    name: in_transition
    description: In transition
    repr: full
  - offset: 2
    size: 1
    type: u8
    name: frames_remaining
    description: Number of frames left to complete the transition on auto
  - offset: 3
    size: 1
    type: "?"
    description: padding
  - offset: 4
    size: 2
    type: u16
    name: position
    description: Position of the transition
    min: 0
    max: 9999
  - offset: 6
    size: 2
    type: "?"
    description: padding

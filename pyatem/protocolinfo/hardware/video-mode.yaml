calculated:
  resolution:
    type: enum
    source: mode
    key: resolution
    description: vertical resolution of the mode
  interlaced:
    type: enum
    source: mode
    key: interlaced
    description: the current mode is interlaced
  rate:
    type: enum
    source: mode
    key: rate
    description: the refresh rate of the mode
  widescreen:
    type: enum
    source: mode
    key: widescreen
    description: this is not a 4:3 resolution
  get_resolution:
    type: lut
    source: resolution
    description: get the resolution as a (width, height) tuple
    access: method
    lut:
      525: [ 720, 480 ]
      625: [ 720, 576 ]
      720: [ 1280, 720 ]
      1080: [ 1920, 1080 ]
      2160: [ 3840, 2160 ]
      4320: [ 7680, 4320 ]
  get_pixels:
    type: code
    access: method
    description: get the total number of pixels in a single frame
    code:
      python: |
        width, height = self.get_resolution()
        return width * height
  get_label:
    type: code
    access: method
    description: get a text description of the current mode
    repr: value
    code:
      python: |
        if self.resolution is None:
            return f'unknown [{self.mode}]'

        pi = 'p'
        if self.interlaced:
            pi = 'i'
        aspect = ''
        if self.resolution < 720:
            if self.widescreen:
                aspect = ' 16:9'
            else:
                aspect = ' 4:3'
        return f'{self.resolution}{pi}{self.rate}{aspect}'

tests:
  - name: mini_1080p60
    label: Atem Mini 1080p60
    raw: 1b000000
    check:
      mode: 27
      rate: 60
      resolution: 1080
      interlaced: false
      widescreen: true
      get_resolution(): [1920, 1080]
      get_pixels(): 2073600
      get_label(): "1080p60"
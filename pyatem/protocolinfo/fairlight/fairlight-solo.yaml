name: fairlight-solo
code: FAMS
description: |
  Data from the `FAMS`, soloing channels to phones.
type: field
fields:
  - offset: 0
    size: 1
    type: bool
    name: solo
    description: Master solo indicator, enabled when any soure is soloed
    repr: full
  - offset: 1
    size: 7
    type: "?"
    description: unknown
  - offset: 8
    size: 2
    type: u16
    name: channel
    description: Soloed channel (main)
  - offset: 10
    size: 12
    type: "?"
    description: unknown
  - offset: 22
    size: 1
    type: u8
    name: is_split_lr
    description: Split
  - offset: 23
    size: 1
    type: u8
    name: subchannel
    description: Soloed channel (subchannel)

calculated:
  strip_id:
    type: code
    description: Channel strip id
    access: property
    code:
      python: return f"{self.channel}.{self.subchannel if self.is_split_lr == 0xFF else 0}"

tests:
  - name: aminiextreme1
    label: Solo Mic 1
    raw: 0115E890FFFFFDA80516FFFFFFFF0100FFFFFFFFFFFF0100
    check:
      strip_id: "1302.0"
      solo: true
      channel: 1302
      subchannel: 0
      is_split_lr: 1